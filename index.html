<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>复习计划</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-4">
    <h3>今日复习计划 - <span id="todayDate"></span></h3>
    <div id="todayReviewList"></div>
  </div>

  <script>
    let records = [
      {
        content: "学习JS",
        learningDate: "2023-10-01",
        reviewPlan: [{ reviewDate: new Date().toISOString().slice(0, 10), completed: false }],
        attachments: [
          { name: "demo.jpg", type: "image/jpeg", data: "data:image/jpeg;base64,/9j/4AAQSkZJRg..." },
          { name: "note.txt", type: "text/plain", data: "data:text/plain;base64,SGVsbG8gV29ybGQ=" }
        ]
      }
    ];

    function saveRecords() {
      localStorage.setItem('records', JSON.stringify(records));
    }

    function renderTodayReviews() {
      const today = new Date().toISOString().slice(0, 10);
      document.getElementById('todayDate').textContent = today;
      const container = document.getElementById('todayReviewList');
      container.innerHTML = '';
      records.forEach(record => {
        record.reviewPlan.forEach((review) => {
          if (review.reviewDate === today) {
            const div = document.createElement('div');
            div.className = 'form-check mb-2';
            const checkbox = document.createElement('input');
            checkbox.className = 'form-check-input';
            checkbox.type = 'checkbox';
            checkbox.checked = review.completed;
            checkbox.addEventListener('change', function () {
              review.completed = this.checked;
              saveRecords();
            });
            const label = document.createElement('label');
            label.className = 'form-check-label';
            label.textContent = record.content + '（学习日期：' + record.learningDate + '）';
            div.appendChild(checkbox);
            div.appendChild(label);

            if (record.attachments && record.attachments.length > 0) {
              const attachmentsSpan = document.createElement('span');
              attachmentsSpan.className = 'ms-2';
              record.attachments.forEach(file => {
                const a = document.createElement('a');
                a.href = '#';
                a.className = 'me-2';
                a.textContent = `[${file.name}]`;
                if (file.type.startsWith('image/')) {
                  a.addEventListener('click', function(event) {
                    event.preventDefault();
                    window.open(file.data, '_blank');
                  });
                } else if (file.type === 'text/plain') {
                  a.addEventListener('click', function(event) {
                    event.preventDefault();
                    showTextFileContent(file);
                  });
                } else {
                  a.href = file.data;
                  a.download = file.name;
                }
                attachmentsSpan.appendChild(a);
              });
              div.appendChild(attachmentsSpan);
            }
            container.appendChild(div);
          }
        });
      });
    }

    function showTextFileContent(file) {
      const base64Data = file.data.split(',')[1];
      const binaryString = atob(base64Data);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      const text = new TextDecoder('utf-8').decode(bytes);
      const newWindow = window.open('', '_blank');
      newWindow.document.write('<pre>' + text + '</pre>');
      newWindow.document.close();
    }

    // 初始化
    renderTodayReviews();
  </script>
</body>
</html>
