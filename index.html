<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>学习记录与复习计划系统</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #74ABE2, #5563DE);
      min-height: 100vh;
      padding: 20px 0;
      color: #333;
    }
    .container {
      max-width: 960px;
    }
    h1 {
      font-weight: 600;
      margin-bottom: 30px;
      color: #fff;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
    }
    .card {
      border: none;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    .card-header {
      background: #fff;
      border-bottom: none;
      font-weight: 600;
      font-size: 1.1rem;
      border-top-left-radius: 15px;
      border-top-right-radius: 15px;
    }
    .card-body {
      background: #fff;
      border-bottom-left-radius: 15px;
      border-bottom-right-radius: 15px;
    }
    .btn-primary {
      background-color: #5563DE;
      border: none;
    }
    .btn-primary:hover {
      background-color: #3f50b5;
    }
    .btn-info {
      background-color: #74ABE2;
      border: none;
    }
    .btn-info:hover {
      background-color: #5aa5d6;
    }
    .form-control, .form-control:focus {
      border-radius: 8px;
      box-shadow: none;
    }
    .table thead {
      background-color: #f8f9fa;
    }
    .review-label {
      margin-left: 8px;
      font-weight: 600;
      color: #333;
    }
    .detail-link {
      cursor: pointer;
      font-size: 0.9rem;
      margin-left: 10px;
      padding: 2px 6px;
      background-color: #74ABE2;
      color: #fff;
      border-radius: 4px;
      font-weight: 600;
    }
    .detail-link:hover {
      background-color: #5aa5d6;
    }
    pre.text-attachment {
      background: #f8f9fa;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      overflow: auto;
      font-size: 24px;
      font-family: '微软雅黑', 'SimHei', sans-serif;
      color: #000;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="text-center">学习记录与复习计划系统</h1>
    
    <div class="card">
      <div class="card-header">新增学习记录</div>
      <div class="card-body">
        <form id="recordForm">
          <div class="mb-3">
            <label for="contentInput" class="form-label">学习内容名称</label>
            <input type="text" id="contentInput" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="dateInput" class="form-label">学习日期</label>
            <input type="date" id="dateInput" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="fileInput" class="form-label">上传附件（txt、图片）</label>
            <input type="file" id="fileInput" class="form-control" accept=".txt,image/*" multiple>
          </div>
          <div class="d-flex">
            <button type="submit" class="btn btn-primary me-2">确定</button>
            <button type="reset" class="btn btn-secondary">重置</button>
          </div>
          <input type="hidden" id="recordId">
        </form>
      </div>
    </div>
    
    <div class="card">
      <div class="card-header">今日复习计划 (<span id="todayDate"></span>)</div>
      <div class="card-body" id="todayReviewList"></div>
    </div>
    
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span>已学习内容清单</span>
        <button class="btn btn-sm btn-outline-secondary" id="toggleRecordsBtn">隐藏</button>
      </div>
      <div class="card-body" id="recordList">
        <div class="table-responsive">
          <table class="table table-bordered align-middle">
            <thead>
              <tr>
                <th>学习内容</th>
                <th>学习日期</th>
                <th>复习计划</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="recordsTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
    
    <div class="card">
      <div class="card-header">复习间隔设置</div>
      <div class="card-body">
        <form id="settingsForm">
          <div class="mb-3">
            <label for="intervalsInput" class="form-label">设置复习时间间隔（单位：天，以逗号分隔）</label>
            <input type="text" id="intervalsInput" class="form-control" value="1,3,7,14,30,60,120,300,600">
          </div>
          <button type="submit" class="btn btn-info">保存设置</button>
        </form>
      </div>
    </div>
    
    <div class="card">
      <div class="card-header">数据备份</div>
      <div class="card-body">
        <button class="btn btn-info me-2" id="exportBtn">导出数据</button>
        <input type="file" id="importInput" accept=".json" style="display: none;">
        <button class="btn btn-info" id="importBtn">导入数据</button>
      </div>
    </div>
  </div>
  
  <div class="modal fade" id="reviewModal" tabindex="-1" aria-labelledby="reviewModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="reviewModalLabel" style="font-weight: 600; color: #5563DE;">附件内容</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
        </div>
        <div class="modal-body" style="font-size: 1rem; line-height: 1.6;"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
        </div>
      </div>
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let records = [];
    let reviewIntervals = [1, 3, 7, 14, 30, 60, 120, 300, 600];
    let lastCheckedDate = new Date().toISOString().slice(0, 10);

    function loadSettings() {
      const settingsStr = localStorage.getItem('reviewIntervals');
      if (settingsStr) {
        reviewIntervals = settingsStr.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));
        document.getElementById('intervalsInput').value = reviewIntervals.join(',');
      }
    }
    
    function saveSettings() {
      localStorage.setItem('reviewIntervals', reviewIntervals.join(','));
    }
    
    function loadRecords() {
      const data = localStorage.getItem('studyRecords');
      if (data) {
        records = JSON.parse(data);
      }
    }
    
    function saveRecords() {
      localStorage.setItem('studyRecords', JSON.stringify(records));
    }
    
    function generateReviewPlan(learningDateStr) {
      const plan = [];
      const baseDate = new Date(learningDateStr);
      reviewIntervals.forEach(interval => {
        const reviewDate = new Date(baseDate);
        reviewDate.setDate(reviewDate.getDate() + interval);
        plan.push({
          reviewDate: reviewDate.toISOString().slice(0, 10),
          completed: false
        });
      });
      return plan;
    }
    
    function renderTodayReviews() {
      const today = new Date().toISOString().slice(0, 10);
      document.getElementById('todayDate').textContent = `${today} (基于本地时间)`;
      const container = document.getElementById('todayReviewList');
      container.innerHTML = '';
      
      const reviewsToShow = [];
      records.forEach(record => {
        record.reviewPlan.forEach(review => {
          const reviewDate = new Date(review.reviewDate);
          const todayDate = new Date(today);
          if (reviewDate <= todayDate && !review.completed) {
            reviewsToShow.push({ record, review });
          }
        });
      });
      
      reviewsToShow.forEach(({ record, review }) => {
        const div = document.createElement('div');
        div.className = 'form-check mb-2';
    
        const checkbox = document.createElement('input');
        checkbox.className = 'form-check-input';
        checkbox.type = 'checkbox';
        checkbox.checked = review.completed;
        checkbox.addEventListener('change', function () {
          review.completed = this.checked;
          saveRecords();
          renderTodayReviews();
        });
        div.appendChild(checkbox);
    
        const label = document.createElement('label');
        label.className = 'review-label';
        label.textContent = `${record.content} （学习日期：${record.learningDate}）`;
        div.appendChild(label);
    
        const detailLink = document.createElement('span');
        detailLink.className = 'detail-link';
        detailLink.textContent = '查看附件内容';
        detailLink.addEventListener('click', function () {
          showReviewDetails(record);
        });
        div.appendChild(detailLink);
    
        container.appendChild(div);
      });
    }
    
    function checkDateAndUpdate() {
      const currentDate = new Date().toISOString().slice(0, 10);
      if (currentDate !== lastCheckedDate) {
        lastCheckedDate = currentDate;
        renderTodayReviews();
      }
    }
    
    setInterval(checkDateAndUpdate, 60000);
    
    function renderRecords() {
      const tbody = document.getElementById('recordsTableBody');
      tbody.innerHTML = '';
      records.forEach(record => {
        const tr = document.createElement('tr');
        tr.appendChild(createTd(record.content));
        tr.appendChild(createTd(record.learningDate));
    
        const tdPlan = document.createElement('td');
        const collapseId = "collapsePlan-" + record.id;
        const toggleButton = document.createElement('button');
        toggleButton.className = 'btn btn-sm btn-link';
        toggleButton.setAttribute("data-bs-toggle", "collapse");
        toggleButton.setAttribute("data-bs-target", "#" + collapseId);
        toggleButton.textContent = "显示复习计划";
        tdPlan.appendChild(toggleButton);
    
        const collapseDiv = document.createElement('div');
        collapseDiv.className = 'collapse mt-2';
        collapseDiv.id = collapseId;
        record.reviewPlan.forEach(r => {
          const p = document.createElement('p');
          p.className = 'mb-1';
          p.textContent = r.reviewDate + (r.completed ? ' ✓' : '');
          collapseDiv.appendChild(p);
        });
    
        collapseDiv.addEventListener('shown.bs.collapse', function() {
          toggleButton.textContent = "隐藏复习计划";
        });
        collapseDiv.addEventListener('hidden.bs.collapse', function() {
          toggleButton.textContent = "显示复习计划";
        });
    
        tdPlan.appendChild(collapseDiv);
        tr.appendChild(tdPlan);
    
        const tdActions = document.createElement('td');
        const editBtn = document.createElement('button');
        editBtn.className = 'btn btn-sm btn-warning me-2';
        editBtn.textContent = '编辑';
        editBtn.addEventListener('click', () => fillFormForEdit(record));
        tdActions.appendChild(editBtn);
        const delBtn = document.createElement('button');
        delBtn.className = 'btn btn-sm btn-danger';
        delBtn.textContent = '删除';
        delBtn.addEventListener('click', () => {
          if (confirm('确定删除该记录吗？')) {
            records = records.filter(r => r.id !== record.id);
            saveRecords();
            renderRecords();
            renderTodayReviews();
          }
        });
        tdActions.appendChild(delBtn);
        tr.appendChild(tdActions);
    
        tbody.appendChild(tr);
      });
    }
    
    function createTd(text) {
      const td = document.createElement('td');
      td.textContent = text;
      return td;
    }
    
    function fillFormForEdit(record) {
      document.getElementById('contentInput').value = record.content;
      document.getElementById('dateInput').value = record.learningDate;
      document.getElementById('recordId').value = record.id;
    }
    
    function showReviewDetails(record) {
      const modalBody = document.querySelector('#reviewModal .modal-body');
      let html = "";
      if(record.attachments && record.attachments.length > 0){
        record.attachments.forEach(file => {
          if(file.type.startsWith('image/')){
            html += `<img src="${file.data}" alt="${file.name}" style="max-width:100%; margin-bottom:10px; border:1px solid #ccc; border-radius:8px;">`;
          } else if(file.type === 'text/plain'){
            let textContent;
            if (file.data.startsWith('data:')) {
              const base64Str = file.data.split(',')[1];
              const binaryStr = atob(base64Str);
              const len = binaryStr.length;
              const bytes = new Uint8Array(len);
              for (let i = 0; i < len; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
              }
              textContent = new TextDecoder('utf-8').decode(bytes);
            } else {
              textContent = file.data;
            }
            html += `<pre class="text-attachment">${textContent}</pre>`;
          } else {
            html += `<p><a href="${file.data}" download="${file.name}" style="color: #5563DE; font-weight:600;">${file.name}</a></p>`;
          }
        });
      } else {
        html = `<p style="color: #888;">无附件内容</p>`;
      }
      modalBody.innerHTML = html;
      const reviewModal = new bootstrap.Modal(document.getElementById('reviewModal'));
      reviewModal.show();
    }
    
    document.getElementById('recordForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const content = document.getElementById('contentInput').value.trim();
      const learningDate = document.getElementById('dateInput').value;
      if (!content || !learningDate) {
        alert('请填写所有字段！');
        return;
      }
      const recordId = document.getElementById('recordId').value;
      if (recordId) {
        const rec = records.find(r => r.id === recordId);
        if (rec) {
          rec.content = content;
          rec.learningDate = learningDate;
          rec.reviewPlan = generateReviewPlan(learningDate);
        }
      } else {
        const newRecord = {
          id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
          content: content,
          learningDate: learningDate,
          attachments: [],
          reviewPlan: generateReviewPlan(learningDate)
        };
        records.push(newRecord);
        const files = document.getElementById('fileInput').files;
        if (files.length > 0) {
          Array.from(files).forEach(file => {
            const reader = new FileReader();
            reader.onload = function (event) {
              newRecord.attachments.push({
                id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
                name: file.name,
                type: file.type,
                data: event.target.result
              });
              saveRecords();
              renderRecords();
            };
            if (file.type === 'text/plain') {
              reader.readAsText(file, 'utf-8');
            } else {
              reader.readAsDataURL(file);
            }
          });
        }
      }
      saveRecords();
      renderRecords();
      renderTodayReviews();
      this.reset();
      document.getElementById('recordId').value = '';
    });
    
    function initDateInput() {
      const today = new Date().toISOString().slice(0, 10);
      const dateInput = document.getElementById('dateInput');
      dateInput.value = today;
      dateInput.max = today;
    }
    
    document.getElementById('settingsForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const input = document.getElementById('intervalsInput').value;
      reviewIntervals = input.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));
      if(reviewIntervals.length === 0){
        alert("请输入有效的复习间隔");
        return;
      }
      saveSettings();
      alert("复习间隔设置已保存！");
    });
    
    document.getElementById('toggleRecordsBtn').addEventListener('click', function () {
      const recordListDiv = document.getElementById('recordList');
      if (recordListDiv.style.display === 'none') {
        recordListDiv.style.display = 'block';
        this.textContent = '隐藏';
      } else {
        recordListDiv.style.display = 'none';
        this.textContent = '显示';
      }
    });
    
    document.getElementById('exportBtn').addEventListener('click', function () {
      const dataStr = JSON.stringify(records);
      const blob = new Blob([dataStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'studyRecords.json';
      a.click();
      URL.revokeObjectURL(url);
    });
    
    document.getElementById('importBtn').addEventListener('click', function () {
      document.getElementById('importInput').click();
    });
    
    document.getElementById('importInput').addEventListener('change', function () {
      const file = this.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function (event) {
          try {
            records = JSON.parse(event.target.result);
            saveRecords();
            renderRecords();
            renderTodayReviews();
            alert("导入成功！");
          } catch (e) {
            alert("导入失败，请检查文件格式。");
          }
        };
        reader.readAsText(file);
      }
    });
    
    window.addEventListener('load', function () {
      initDateInput();
      loadSettings();
      loadRecords();
      renderRecords();
      renderTodayReviews();
    });
  </script>
</body>
</html>
